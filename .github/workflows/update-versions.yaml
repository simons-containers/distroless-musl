name: Update versions

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest versions
        uses: nick-fields/retry@v4
        with:
          max_attempts: 5
          timeout_minutes: 10
          command: |
            set -uo pipefail
            MUSL=$(git ls-remote --tags https://git.musl-libc.org/git/musl \
              | awk -F/ '/v[0-9\.]+$/ {gsub("v", ""); print $3}' \
              | sort -V | tail -1)
            TZDB=$(curl -sf https://data.iana.org/time-zones/tzdb/version)
  
            : ${MUSL:?} ${TZDB:?}
  
            jq \
              --arg musl "$MUSL" \
              --arg tzdb  "$TZDB" \
              '
                .musl.version = $musl |
                .tzdb.version  = $tzdb
              ' sources.json > tmp.json && mv tmp.json sources.json

            git diff sources.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-versions
          delete-branch: true
          title: Update versions
          commit-message: Update versions
